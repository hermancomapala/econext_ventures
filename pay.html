<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment License</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="pay.css">
</head>
<body>
  <div class="container py-5">
    <!-- Title -->
    <div class="row mb-4">
      <div class="col-lg-8 mx-auto text-center">
        <h1 class="display-6">Payment License Malware</h1>
      </div>
    </div>

    <div class="row">
      <div class="col-lg-6 mx-auto">
        <div class="card">
          <div class="card-header">
            <div class="bg-white shadow-sm pt-4 px-2 pb-2">
              <!-- Credit card form tabs -->
              <ul role="tablist" class="nav bg-light nav-pills rounded nav-fill mb-3">
                <li class="nav-item">
                  <a data-bs-toggle="pill" href="#credit-card" class="nav-link active">
                    <i class="fas fa-credit-card me-2"></i> Banking
                  </a>
                </li>
                <li class="nav-item">
                  <a data-bs-toggle="pill" href="#net-banking" class="nav-link">
                    <i class="fas fa-mobile-alt me-2"></i> Net Banking
                  </a>
                </li>
              </ul>
            </div>
          </div>

          <div class="card-body">
            <div class="tab-content">
              <!-- Credit Card -->
              <div id="credit-card" class="tab-pane fade show active pt-3">
                <form role="form" onsubmit="event.preventDefault()">
                  <div class="form-group mb-3">
                    <label for="username"><h6>Bank Owner</h6></label>
                    <input type="text" id="username" name="username" placeholder="Bank Owner Name" required class="form-control">
                  </div>

                  <div class="form-group mb-3">
                    <label for="username"><h6>Cost Amount</h6></label>
                    <input type="text" id="username" name="username" placeholder="Pay Cost Amount" required class="form-control">
                  </div>

                  <div class="form-group mb-3">
                    <label for="cardNumber"><h6>Bank number</h6></label>
                    <div class="input-group">
                      <input type="text" id="cardNumber" name="cardNumber" placeholder="Valid bank number" class="form-control" required>
                      <span class="input-group-text text-muted">
                        <i class="fab fa-cc-visa mx-1"></i>
                        <i class="fab fa-cc-mastercard mx-1"></i>
                        <i class="fab fa-cc-amex mx-1"></i>
                      </span>
                    </div>
                  </div>

                  <div class="card-footer">
                    <button type="submit" class="subscribe btn btn-primary btn-block shadow-sm">Confirm Payment</button>
                  </div>
                </form>
              </div>

              <!-- Paypal -->
              <div id="paypal" class="tab-pane fade pt-3">
                <h6 class="pb-2">Select your paypal account type</h6>
                <div class="form-group mb-3">
                  <label class="radio-inline">
                    <input type="radio" name="optradio" checked> Domestic
                  </label>
                  <label class="radio-inline ms-5">
                    <input type="radio" name="optradio"> International
                  </label>
                </div>
              </div>

              <!-- Net Banking -->
              <div id="net-banking" class="tab-pane fade pt-3">
                <div class="form-group mb-3">
                  <label for="bankSelect"><h6>Select your Bank</h6></label>
                  <select class="form-control" id="bankSelect">
                    <option value="" selected disabled>--Please select your Bank--</option>
                    <option>Bank BRI</option>
                    <option>Bank BNI</option>
                    <option>Bank MANDIRI</option>
                    <option>Bank BSI</option>
                    <option>Bank SEA INDONESIA</option>
                    <option>Bank BCA</option>
                    <option>Bank BTN</option>
                    <option>Bank CIMB NIAGA</option>
                    <option>Bank PERMATA</option>
                    <option>Bank DANAMON</option>
                  </select>
                </div>
                <p><button type="button" class="btn btn-primary"><i class="fas fa-mobile-alt me-2"></i> Proceed Payment</button></p>
                <p class="text-muted">Note: You will be redirected to a secure payment gateway. Once the process is complete.</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
$(function() {
  $('[data-toggle="tooltip"]').tooltip()
})
  </script>
</body>
</html>
